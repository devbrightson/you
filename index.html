<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Joyeux anniversaire Kaisha ❤️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{
  --night:#12052a;
  --plum:#2a0d52;
  --violet:#7c3aed;
  --orchid:#c084fc;
  --lilac:#e9d5ff;
  --rose:#f5a3e0;
  --ink:#fbf6ff;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --script:'Great Vibes','Brush Script MT','Segoe Script',cursive;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--night);color:var(--ink);font-family:var(--serif);}
body{overflow:hidden;}

#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;}

/* ───────── vues ───────── */
.view{
  position:fixed;inset:0;z-index:5;
  overflow-y:auto;overflow-x:hidden;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  opacity:0;pointer-events:none;
  transform:translateY(14px);
  transition:opacity .55s ease,transform .55s ease;
}
.view.active{opacity:1;pointer-events:auto;transform:none;}

/* ───────── accueil ───────── */
#home{display:flex;flex-direction:column;align-items:center;justify-content:center;justify-content:safe center;text-align:center;padding:2rem 1.4rem;}
.hello{font-size:1.15rem;font-style:italic;color:var(--lilac);opacity:.85;margin-bottom:.4rem;}
.title{
  font-family:var(--script);font-weight:400;
  font-size:clamp(2.6rem,12vw,4.4rem);line-height:1.05;
  color:var(--ink);
  text-shadow:0 0 18px rgba(192,132,252,.9),0 0 46px rgba(124,58,237,.8);
}
.name{
  display:block;
  font-size:clamp(4rem,19vw,7rem);
  background:linear-gradient(110deg,#fff 0%,var(--orchid) 40%,var(--rose) 70%,#fff 100%);
  background-size:260% 100%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 22px rgba(168,85,247,.75));
  animation:shimmer 6s linear infinite;
}
@keyframes shimmer{to{background-position:260% 50%;}}

.doors{display:flex;gap:1rem;margin-top:2.4rem;width:100%;max-width:420px;}
.door{
  flex:1;cursor:pointer;border:none;color:var(--ink);font-family:var(--serif);
  padding:1.5rem .6rem 1.3rem;border-radius:26px;
  background:linear-gradient(160deg,rgba(124,58,237,.38),rgba(42,13,82,.7));
  border:1px solid rgba(192,132,252,.5);
  box-shadow:0 0 34px rgba(124,58,237,.45),inset 0 0 22px rgba(192,132,252,.12);
  backdrop-filter:blur(6px);
  transition:transform .25s,box-shadow .25s;
}
.door:active{transform:scale(.97);}
.door:hover{transform:translateY(-5px);box-shadow:0 0 52px rgba(168,85,247,.7),inset 0 0 26px rgba(192,132,252,.2);}
.door .ico{font-size:2.3rem;display:block;margin-bottom:.5rem;}
.door b{display:block;font-size:1.55rem;font-weight:600;letter-spacing:.02em;}
.door span{display:block;font-size:.95rem;font-style:italic;color:var(--lilac);opacity:.8;margin-top:.15rem;}

/* ───────── en-tête des pages ───────── */
.bar{
  position:sticky;top:0;z-index:6;
  display:flex;align-items:center;gap:.8rem;
  padding:.9rem 1.1rem;
  background:linear-gradient(180deg,rgba(18,5,42,.96),rgba(18,5,42,.6));
  backdrop-filter:blur(8px);
}
.back{
  cursor:pointer;font-family:var(--serif);font-size:1.05rem;color:var(--ink);
  padding:.45rem 1.1rem;border-radius:999px;
  border:1px solid rgba(192,132,252,.6);background:rgba(124,58,237,.22);
}
.bar h2{font-family:var(--script);font-weight:400;font-size:2rem;color:var(--lilac);text-shadow:0 0 14px rgba(168,85,247,.8);}

/* ───────── message ───────── */
.letter{
  max-width:560px;margin:.6rem auto 3rem;padding:0 1.3rem;
}
.paper{
  padding:2rem 1.5rem 2.2rem;border-radius:26px;
  background:linear-gradient(165deg,rgba(60,20,110,.72),rgba(22,6,48,.9));
  border:1px solid rgba(192,132,252,.38);
  box-shadow:0 0 60px rgba(124,58,237,.35);
}
.paper p{
  font-size:1.2rem;line-height:1.75;color:#f3e8ff;
  margin-bottom:1.25rem;
  opacity:0;transform:translateY(10px);
  transition:opacity .9s ease,transform .9s ease;
}
.paper p.in{opacity:1;transform:none;}
.paper p:first-child{
  font-size:1.5rem;font-style:italic;font-weight:600;color:var(--ink);text-align:center;
  text-shadow:0 0 16px rgba(192,132,252,.8);
}
.paper p.sep{text-align:center;font-size:1.3rem;font-style:italic;color:var(--lilac);}
.paper p:last-child{margin-bottom:0;}

/* ───────── souvenirs ───────── */
.grid{
  max-width:900px;margin:.4rem auto 3rem;padding:0 clamp(.8rem,4vw,1.6rem);
  display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));
  gap:clamp(.8rem,3vw,1.4rem);
}
.shot{
  cursor:pointer;position:relative;
  padding:.55rem .55rem 1.9rem;border-radius:14px;
  background:linear-gradient(170deg,rgba(124,58,237,.35),rgba(42,13,82,.8));
  border:1px solid rgba(192,132,252,.45);
  box-shadow:0 0 28px rgba(124,58,237,.35);
  transition:transform .25s,box-shadow .25s;
}
.shot:nth-child(odd){transform:rotate(-2deg);}
.shot:nth-child(even){transform:rotate(2deg);}
.shot:hover{transform:rotate(0) scale(1.03);box-shadow:0 0 44px rgba(168,85,247,.6);}
.shot .frame{
  aspect-ratio:1/1;border-radius:9px;overflow:hidden;
  background:rgba(18,5,42,.7);
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  text-align:center;color:var(--lilac);font-style:italic;font-size:.95rem;padding:.4rem;
}
.shot .frame img{width:100%;height:100%;object-fit:cover;display:block;}
.shot .frame .cam{font-size:2rem;margin-bottom:.2rem;}
.shot .cap{
  position:absolute;left:.6rem;right:.6rem;bottom:.35rem;
  text-align:center;font-size:1rem;font-style:italic;color:var(--lilac);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.shot.empty{cursor:default;}

/* visionneuse */
#lightbox{
  position:fixed;inset:0;z-index:30;
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  background:rgba(12,3,28,.92);backdrop-filter:blur(6px);
  opacity:0;pointer-events:none;transition:opacity .35s;padding:1.2rem;
}
#lightbox.show{opacity:1;pointer-events:auto;}
#lightbox img{
  max-width:100%;max-height:68vh;max-height:68dvh;border-radius:16px;
  border:1px solid rgba(192,132,252,.55);box-shadow:0 0 60px rgba(124,58,237,.6);
}
#lbCap{margin-top:1rem;font-size:1.3rem;font-style:italic;text-align:center;color:var(--lilac);max-width:440px;}
#lbClose{
  margin-top:1.2rem;cursor:pointer;font-family:var(--serif);font-size:1.05rem;color:var(--ink);
  padding:.5rem 1.4rem;border-radius:999px;border:1px solid rgba(192,132,252,.6);background:rgba(124,58,237,.25);
}

.bar h2{font-size:clamp(1.5rem,6vw,2.2rem);}

/* très petits écrans : les deux champs s’empilent */
@media (max-width:359px){
  .doors{flex-direction:column;}
  .paper{padding:1.6rem 1.1rem 1.8rem;}
  .paper p{font-size:1.1rem;}
}
/* tablette */
@media (min-width:700px){
  .letter{max-width:680px;}
  .paper{padding:2.8rem 2.6rem 3rem;}
  .paper p{font-size:1.32rem;}
  .doors{max-width:520px;gap:1.4rem;}
  .shot .cap{font-size:1.1rem;}
  .grid{grid-template-columns:repeat(3,1fr);max-width:760px;}
}
/* ordinateur */
@media (min-width:1100px){
  .letter{max-width:760px;}
  .doors{max-width:560px;}
}
/* téléphone en mode paysage */
@media (max-height:520px) and (orientation:landscape){
  #home{padding:1rem 1.4rem;}
  .title{font-size:clamp(2rem,7vw,3rem);}
  .name{font-size:clamp(2.6rem,10vw,4rem);}
  .doors{margin-top:1.1rem;}
  .door{padding:.8rem .5rem;}
  .door .ico{font-size:1.6rem;margin-bottom:.2rem;}
  #lightbox img{max-height:55vh;}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important;}}
</style>
</head>
<body>

<canvas id="bg"></canvas>

<!-- ═════════ ACCUEIL ═════════ -->
<main id="home" class="view active">
  <p class="hello">Aujourd’hui, c’est ton jour ❤️</p>
  <h1 class="title">Joyeux anniversaire<span class="name">Kaisha</span></h1>

  <div class="doors">
    <!-- Champ 1 : Souvenir -->
    <button class="door" data-go="souvenir">
      <span class="ico">📸</span><b>Souvenir</b><span>nos photos</span>
    </button>
    <!-- Champ 2 : Message -->
    <button class="door" data-go="message">
      <span class="ico">💌</span><b>Message</b><span>pour toi</span>
    </button>
  </div>
</main>

<!-- ═════════ SOUVENIR ═════════ -->
<section id="souvenir" class="view">
  <div class="bar"><button class="back" data-go="home">← Retour</button><h2>Nos souvenirs</h2></div>
  <div class="grid" id="grid"></div>
</section>

<!-- ═════════ MESSAGE ═════════ -->
<section id="message" class="view">
  <div class="bar"><button class="back" data-go="home">← Retour</button><h2>Mon message</h2></div>
  <div class="letter"><div class="paper" id="paper"></div></div>
</section>

<!-- visionneuse photo -->
<div id="lightbox">
  <img id="lbImg" alt="">
  <p id="lbCap"></p>
  <button id="lbClose">Fermer</button>
</div>

<script>
/* ════════════════════════════════════════════════════════════
   1) SOUVENIRS — C’EST ICI QUE TU AJOUTES TES PHOTOS
   ────────────────────────────────────────────────────────────
   Pour chaque photo, colle dans  src  le lien de partage Google Drive
   tel quel, par exemple :
     src: 'https://drive.google.com/file/d/1AbCdEfGhIjKlMnOpQrStUvWxYz/view?usp=sharing'
   (le fichier est converti automatiquement, rien d’autre à faire)

   Dans Google Drive, pour CHAQUE photo :
     clic droit › Partager › Accès général › « Tous les utilisateurs
     disposant du lien » › Copier le lien.
   ⚠ Il faut le lien de la PHOTO, pas celui d’un dossier.

   Ça marche aussi avec une URL normale (https://…/photo.jpg)
   ou du base64 (data:image/jpeg;base64,…).
   Laisse  src: ''  pour garder un cadre vide.
   Change  caption  pour modifier la légende sous la photo.
   Pour une photo de plus : copie une ligne { ... }, et ajoute une virgule.
   ════════════════════════════════════════════════════════════ */
const SOUVENIRS = [
  { src: 'https://drive.google.com/file/d/1rq2I_4pqwa0cHIw8NdEG5f96GphfwqsE/view?usp=sharing',  caption: 'Notre premier souvenir' },   // ← PHOTO 1 : colle ton lien Google Drive entre les ''
  { src: 'https://drive.google.com/file/d/1sSuGxbnYeO_ogfe3DQZNSV38e4hXnkFs/view?usp=sharing',  caption: 'Un jour inoubliable' },      // ← PHOTO 2
  { src: 'https://drive.google.com/file/d/1XDaZ74Gn6oWSdGFBGT885X-LOjNLzvDe/view?usp=sharing',  caption: 'Toi et moi' },               // ← PHOTO 3
  { src: 'https://drive.google.com/file/d/1NLLium4_myBQ4GtxMs2YBUFLKoWHVqJI/view?usp=sharing',  caption: 'Ton plus beau sourire' },    // ← PHOTO 4
  { src: 'https://drive.google.com/file/d/1ACzH-UPMwp8c-xR9x9LOfzgvY6k8szIo/view?usp=sharing',  caption: 'Nos rires' },                // ← PHOTO 5
  { src: 'https://drive.google.com/file/d/1Egz1pVMQxRusqLmVwco5zHHVDx5wxhee/view?usp=sharing',  caption: 'Pour toujours' }             // ← PHOTO 6
];

/* ════════════════════════════════════════════════════════════
   2) MESSAGE — le texte (un paragraphe par ligne)
   Pour modifier le texte, change directement les phrases ci-dessous.
   ════════════════════════════════════════════════════════════ */
const MESSAGE = [
`Joyeux anniversaire, mon amour, Kaisha ! ❤️🎂`,
`Aujourd’hui n’est pas un jour comme les autres, car c’est une date qui mérite d’être célébrée avec toute la tendresse du monde : celle où une personne merveilleuse a vu le jour. Et cette personne, c’est toi. Si je pouvais trouver les mots les plus beaux, les plus doux et les plus précieux pour te souhaiter un heureux anniversaire, je crois même qu’ils ne suffiraient pas à exprimer tout ce que mon cœur ressent pour toi.`,
`Kaisha, je veux profiter de cette journée pour te rappeler à quel point tu occupes une place immense dans ma vie. Depuis que tu en fais partie, tu es devenue bien plus qu'une simple personne à mes côtés. Tu es celle dont la présence peut illuminer mes journées, celle qui donne une saveur particulière aux petits moments, celle à qui mes pensées reviennent même lorsque nous sommes loin l'un de l'autre. Tu as une importance que je ne pourrais jamais mesurer, car ce que je ressens dépasse largement les simples mots.`,
`Je t'aime pour la personne que tu es, pour ta manière d'exister, pour ce qui te rend unique, pour tes qualités, tes imperfections, tes sourires et même ces petits détails que tu ne remarques peut-être pas, mais qui me font tellement craquer. Je t'aime dans les moments de bonheur comme dans les périodes plus compliquées. Je veux être celui qui t'encourage lorsque tu doutes, qui te rappelle ta valeur lorsque tu l'oublies, qui célèbre tes réussites et qui te tend la main lorsque la vie devient difficile.`,
`En ce jour spécial, je prie Dieu de veiller sur toi, de protéger tes pas, de préserver ta santé et de remplir ton existence de bénédictions. Que chacun de tes rêves trouve un chemin vers la réalisation, que tes efforts portent de beaux fruits et que ton sourire ne perde jamais son éclat. Je te souhaite une vie remplie de paix, de réussite, de belles surprises et de raisons sincères de rire. Tu mérites tellement de belles choses, et j'espère que la vie saura te les offrir avec générosité.`,
`J'aimerais pouvoir te donner bien plus qu'un simple message aujourd'hui. J'aimerais te faire ressentir, à travers chaque geste, chaque regard et chaque attention, combien tu es précieuse à mes yeux. J'aimerais que tu puisses voir ton importance avec mon cœur, ne serait-ce qu'un instant, afin de comprendre pourquoi ta place dans ma vie est aussi particulière. Je ne prétends pas être parfait, ni avoir toujours les mots justes, mais je peux te promettre une chose : mes sentiments pour toi sont sincères, et je ne considère jamais ta présence comme quelque chose d'acquis.`,
`Je ne sais pas exactement ce que l'avenir nous réserve, mais je souhaite de tout cœur continuer à écrire de belles pages avec toi. Je veux encore partager des éclats de rire, construire des souvenirs, traverser les saisons de la vie et découvrir chaque jour de nouvelles raisons de t'aimer. Je souhaite que, lorsque tu regarderas derrière toi, tu puisses te souvenir de tout l'amour, de toute l'attention et de toute la douceur que j'aurai essayé de mettre dans notre histoire.`,
`Joyeux anniversaire à la femme qui fait battre mon cœur d'une manière si particulière. ❤️`,
`Merci d'exister, merci d'être cette personne exceptionnelle et merci de me permettre de connaître le bonheur de t'aimer. Aujourd'hui, c'est ton jour, alors profite de chaque seconde, laisse-toi couvrir d'amour et n'oublie jamais que quelque part, il y a un cœur qui te porte dans ses pensées et qui souhaite te voir heureuse plus que tout.`,
`Je t'aime profondément, Kaisha. Que cette nouvelle année de ta vie soit encore plus belle que toutes celles qui l'ont précédée. Et si je pouvais faire un seul vœu pour cette journée, ce serait de voir tes yeux briller de bonheur, ton âme trouver la paix et ton cœur ne jamais manquer d'amour.`,
`Bon anniversaire, mon trésor. Tu es une partie précieuse de mon bonheur, et je suis infiniment heureux de pouvoir célébrer ton existence. Je t'aime aujourd'hui, je t'aimerai demain, et j'espère avoir encore mille occasions de te le prouver. ❤️🥹💍`
];

/* ═════════════ à partir d’ici, pas besoin de modifier ═════════════ */

/* --- navigation entre les vues --- */
const views = ['home','souvenir','message'];
function go(id){
  views.forEach(v => document.getElementById(v).classList.toggle('active', v === id));
  const el = document.getElementById(id); el.scrollTop = 0;
  if(id === 'message') revealParagraphs();
}
document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));

/* --- message : paragraphes qui apparaissent en douceur --- */
const paper = document.getElementById('paper');
const SEPARATE = [7];   // paragraphes mis en valeur (centrés)
MESSAGE.forEach((t, i) => {
  const p = document.createElement('p');
  p.textContent = t;
  if(SEPARATE.includes(i)) p.className = 'sep';
  paper.appendChild(p);
});
let io;
function revealParagraphs(){
  const root = document.getElementById('message');
  const ps = paper.querySelectorAll('p');
  ps.forEach(p => p.classList.remove('in'));
  if(io) io.disconnect();
  io = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } }),
    { root, threshold:.15 });
  ps.forEach(p => io.observe(p));
}

/* --- souvenirs : grille de polaroïds --- */
const grid = document.getElementById('grid');
const lb = document.getElementById('lightbox'), lbImg = document.getElementById('lbImg'), lbCap = document.getElementById('lbCap');
/* Google Drive : extrait l’identifiant du fichier depuis un lien de partage */
function driveId(s){
  s = (s || '').trim();
  if(/^data:/.test(s)) return null;                                   // base64 : pas Drive
  if(/^https?:/.test(s) && !/drive\.google\.com|googleusercontent\.com/.test(s)) return null;  // autre site
  const m = s.match(/\/d\/([\w-]{10,})/) || s.match(/[?&]id=([\w-]{10,})/);
  if(m) return m[1];
  return /^[\w-]{20,}$/.test(s) ? s : null;                           // un simple ID collé seul
}
/* Liste d’adresses d’image à essayer, dans l’ordre */
function candidates(src, w){
  const id = driveId(src);
  if(!id) return [src];
  return [
    'https://drive.google.com/thumbnail?id=' + id + '&sz=w' + w,
    'https://lh3.googleusercontent.com/d/' + id + '=w' + w,
    'https://drive.google.com/uc?export=view&id=' + id
  ];
}
/* Essaie chaque adresse jusqu’à ce qu’une fonctionne */
function loadWithFallback(img, list, onFail){
  let k = 0;
  img.referrerPolicy = 'no-referrer';
  img.onerror = () => { k++; if(k < list.length) img.src = list[k]; else onFail(); };
  img.src = list[0];
}

SOUVENIRS.forEach((s, i) => {
  const d = document.createElement('div');
  d.className = 'shot' + (s.src ? '' : ' empty');
  const frame = document.createElement('div'); frame.className = 'frame';
  if(s.src){
    const img = new Image(); img.alt = s.caption; img.loading = 'lazy'; img.decoding = 'async';
    loadWithFallback(img, candidates(s.src, 700), () => {
      frame.innerHTML = '<span class="cam">📷</span>Photo introuvable<br><small>Vérifie le partage du lien</small>';
      d.classList.add('empty');
    });
    frame.appendChild(img);
    d.addEventListener('click', () => {
      if(d.classList.contains('empty')) return;
      lbImg.removeAttribute('src');
      loadWithFallback(lbImg, candidates(s.src, 1600), () => lb.classList.remove('show'));
      lbCap.textContent = s.caption; lb.classList.add('show');
    });
  } else {
    frame.innerHTML = '<span class="cam">📷</span>Photo ' + (i + 1);
  }
  const cap = document.createElement('div'); cap.className = 'cap'; cap.textContent = s.caption;
  d.append(frame, cap);
  grid.appendChild(d);
});
document.getElementById('lbClose').addEventListener('click', () => lb.classList.remove('show'));
lb.addEventListener('click', e => { if(e.target === lb) lb.classList.remove('show'); });

/* --- fond animé : étoiles, cœurs et lueurs violettes --- */
const cv = document.getElementById('bg'), cx = cv.getContext('2d');
let W, H, dots = [];
const RM = matchMedia('(prefers-reduced-motion:reduce)').matches;
function size(){ W = cv.width = innerWidth; H = cv.height = innerHeight; }
size(); addEventListener('resize', size);
for(let i = 0; i < 90; i++) dots.push({
  x:Math.random(), y:Math.random(), r:Math.random()*1.8+.4,
  s:Math.random()*.00006+.00002, t:Math.random()*6.28,
  heart:Math.random() < .22
});
function heart(x, y, s){
  cx.beginPath();
  cx.moveTo(x, y + s*.3);
  cx.bezierCurveTo(x, y - s*.2, x - s, y - s*.2, x - s, y + s*.35);
  cx.bezierCurveTo(x - s, y + s*.8, x, y + s*1.05, x, y + s*1.3);
  cx.bezierCurveTo(x, y + s*1.05, x + s, y + s*.8, x + s, y + s*.35);
  cx.bezierCurveTo(x + s, y - s*.2, x, y - s*.2, x, y + s*.3);
  cx.fill();
}
function frame(now){
  cx.clearRect(0, 0, W, H);
  const g = cx.createRadialGradient(W/2, H*.4, 0, W/2, H*.4, Math.max(W, H)*.8);
  g.addColorStop(0, '#3b1478'); g.addColorStop(.55, '#1d0842'); g.addColorStop(1, '#0e0320');
  cx.fillStyle = g; cx.fillRect(0, 0, W, H);
  dots.forEach(d => {
    if(!RM) d.y -= d.s * 16;
    if(d.y < -.05) d.y = 1.05;
    const a = .25 + .55*Math.abs(Math.sin(now*.0012 + d.t));
    if(d.heart){
      cx.fillStyle = 'rgba(245,163,224,' + a*.7 + ')';
      heart(d.x*W, d.y*H, d.r*3.2);
    } else {
      cx.fillStyle = 'rgba(233,213,255,' + a + ')';
      cx.beginPath(); cx.arc(d.x*W, d.y*H, d.r, 0, 6.283); cx.fill();
    }
  });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
